<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <style>
    body {
      margin: 0; height: 100vh; display: flex; align-items: center; justify-content: center;
      background: #fff; color: #444;
      font: 13px/1.7 system-ui, "Microsoft YaHei", sans-serif;
    }
    .b { padding: 16px; max-width: 400px; }
    kbd { background: #f0f0f0; border: 1px solid #ddd; border-radius: 3px; padding: 0 5px; }
  </style>
</head>
<body>
  <div class="b">
    输入 <b>哔哩哔哩</b> / 网址后按 Go<br />
    <kbd>Ctrl+滚轮</kbd> 网页放大缩小 &nbsp;
    <kbd>Alt+滚轮</kbd> 透明度 &nbsp;
    <kbd>`</kbd> 隐身 &nbsp;
    <kbd>F12</kbd> 去顶栏
  </div>
</body>
</html>
